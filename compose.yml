services:
  microservice:
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest
    container_name: cloudmarket-api
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-demo}
      NOTIFICACIONES_URL: http://notificaciones-api:8081
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:-}
      ORACLE_USERNAME: ${ORACLE_USERNAME:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
    volumes:
      - cloudmarket_data:/app/data
    depends_on:
      - notificaciones-api

  notificaciones-api:
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}-notificaciones:latest
    container_name: notificaciones-api
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-demo}
      ORACLE_JDBC_URL: ${AUDIT_ORACLE_JDBC_URL:-}
      ORACLE_USERNAME: ${AUDIT_ORACLE_USERNAME:-}
      ORACLE_PASSWORD: ${AUDIT_ORACLE_PASSWORD:-}
    volumes:
      - notificaciones_data:/app/data

volumes:
  cloudmarket_data:
  notificaciones_data:
