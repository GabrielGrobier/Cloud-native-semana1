spring.application.name=cloudmarket-api
server.port=8080
# Demo: H2 en archivo. Perfil oracle: conexion externa en Oracle Cloud.
spring.datasource.url=jdbc:h2:file:./data/cloudmarketdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8081}
